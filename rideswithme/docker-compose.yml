# Local development stack.
#   docker compose up -d postgres redis s3   data stores only; run the apps on your machine (see README)
#   docker compose --profile app up --build  everything, including migrations, the API and the admin dashboard
name: rideswithme

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rideswithme
      POSTGRES_PASSWORD: rideswithme
      POSTGRES_DB: rideswithme
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rideswithme -d rideswithme']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage for local development and CI (moto). It keeps files in
  # memory, so uploads disappear when it restarts. Production uses a real
  # S3-compatible service with private buckets (see documentation/DECISIONS.md).
  s3:
    image: motoserver/moto:5.2.5
    ports: ['9000:5000']

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgres://rideswithme:rideswithme@postgres:5432/rideswithme
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: [app]
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile, target: api }
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgres://rideswithme:rideswithme@postgres:5432/rideswithme
      REDIS_URL: redis://redis:6379/0
      # The compose stack is for development, so the console SMS provider is allowed.
      NODE_ENV: development
      S3_ENDPOINT: http://s3:5000
      # Signed links must point somewhere the phone or browser can reach.
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_CREATE_BUCKET: 'true'
      # The admin dashboard is a proxy in front of the API.
      TRUST_PROXY_HOPS: '1'
    ports: ['3000:3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_started }

  admin-dashboard:
    profiles: [app]
    build: { context: ., dockerfile: infrastructure/docker/admin-dashboard.Dockerfile }
    env_file: apps/admin-dashboard/.env.local
    environment:
      API_URL: http://api:3000
      STORAGE_ORIGIN: http://localhost:9000
      SESSION_COOKIE_SECURE: 'false'
    ports: ['3001:3001']
    depends_on:
      api: { condition: service_started }

volumes:
  postgres-data:
