# Monitoring stack, run beside (not inside) the app servers:
#   echo "<METRICS_TOKEN>" > metrics-token
#   docker compose -f docker-compose.monitoring.yml up -d
name: rideswithme-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    ports: ['127.0.0.1:9090:9090']
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ['127.0.0.1:9093:9093']
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
volumes:
  prometheus-data:
